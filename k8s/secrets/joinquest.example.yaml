# EXAMPLE secret — copy to joinquest.yaml and fill in real values.
#
# These are the per-game credentials the JoinQuest developer dashboard issues
# when the game is registered:
#
#   serviceToken   — this game authenticating itself to JoinQuest
#   webhookSecret  — verifying that a webhook really came from JoinQuest
#
# Read them from the dashboard (or the joinquest-integration MCP's
# get_game_credentials) and paste them here. Nothing consumes them until
# JQ-188 builds the session layer; k8s/base/api.yaml marks both `optional: true`
# so the API starts fine before this secret exists.
#
#   cp k8s/secrets/joinquest.example.yaml k8s/secrets/joinquest.yaml
apiVersion: v1
kind: Secret
metadata:
  name: go-forth-joinquest
  namespace: go-forth
type: Opaque
stringData:
  JOINQUEST_SERVICE_TOKEN: "CHANGE_ME"
  JOINQUEST_WEBHOOK_SECRET: "CHANGE_ME"
