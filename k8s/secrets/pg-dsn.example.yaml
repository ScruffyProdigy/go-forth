# EXAMPLE secret — copy to pg-dsn.yaml and fill in real values.
# pg-dsn.yaml is gitignored; only *.example.yaml is ever committed, and
# environment-config-test.yml fails the build if that stops being true.
#
#   cp k8s/secrets/pg-dsn.example.yaml k8s/secrets/pg-dsn.yaml
#   # edit the values — then scripts/deploy-*.sh applies it
#
# This is the GAME's own database — never the Lobby's.
apiVersion: v1
kind: Secret
metadata:
  name: go-forth-pg-dsn
  namespace: go-forth
type: Opaque
stringData:
  POSTGRES_USER: "goforth"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "go_forth"
  # In-cluster Postgres (the service name from k8s/base/postgres.yaml), or an
  # external managed database.
  DATABASE_URL: "postgres://goforth:CHANGE_ME@go-forth-postgres:5432/go_forth"
