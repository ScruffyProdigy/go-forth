# TLS certificate for go-forth.staging.joinquest.cc (cert-manager). The Secret named here is the one
# staging-ingress.yaml references; the two names must match.
#
# HTTP-01 validation means the hostname must already resolve to the ingress
# controller before this will issue — a Certificate for a name with no A record
# sits in a retry loop rather than failing loudly.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: go-forth-staging
  namespace: go-forth
spec:
  secretName: go-forth-staging-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - go-forth.staging.joinquest.cc
