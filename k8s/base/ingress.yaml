# Routes /api and /healthz to the game API, everything else to the client.
#
# Host is a placeholder overridden per environment. The long proxy timeouts are
# for the gameplay WebSocket JQ-188 adds under /api — the nginx ingress upgrades
# WS automatically, but its 60s default read timeout would cut an idle socket.
#
# An env ingress overlay REPLACES these rules wholesale, so every path added
# here must be added there too. environment-config-test.yml enforces that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-forth
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: go-forth.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: go-forth-api
                port:
                  number: 3002
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: go-forth-api
                port:
                  number: 3002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-forth-client
                port:
                  number: 80
