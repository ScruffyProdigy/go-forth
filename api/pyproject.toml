[project]
name = "go-forth-api"
version = "0.1.0"
description = "Go Forth! game server — the JoinQuest Python reference implementation"
# Mirrors the `engines.node` ">=20 <23" bound the TypeScript scaffold set: a
# floor recent enough to write current Python, and a ceiling so a brand-new
# release is adopted deliberately rather than by whatever CI happens to pick.
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    # Seat JWTs. rpslr verifies them with `jose`; the Python reference uses
    # PyJWT, which is what a Python developer reaching for this contract would
    # already have. `[crypto]` is the RS256 half — without it PyJWT can decode
    # a token but not check that the Lobby signed it.
    "pyjwt[crypto]>=2.9.0",
    # The game talks to Lobby's GraphQL for `reportMatchResult`; the same client
    # is what the tests inject a transport into.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    # scripts/stub_lobby.py mints the RS256 seat tokens that stand in for the
    # Lobby, and tests/lobby/signing.py mints them again to exercise the claim
    # and rotation rows. Verification now needs it too, so it arrives via
    # `pyjwt[crypto]` in the runtime dependencies — this pin only keeps the
    # stub working when someone installs dev extras alone.
    "cryptography>=43.0.0",
]

[project.scripts]
go-forth-api = "app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `tests/` sits outside the package, so the package directory has to be on the
# path. This replaces the temporary `api/conftest.py` the sim port needed
# before this file existed.
pythonpath = ["."]
testpaths = ["tests"]
# The session ticks on asyncio, so the round/realtime tests are coroutines.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade — keeps the code in the version it claims to target
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
# The sim's determinism work depends on being told when a type is silently Any.
warn_unreachable = true
