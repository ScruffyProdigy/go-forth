name: api-tests

# Path-filtered: `api/` and `client/` are independent packages, so a client-only
# change has no business spending a runner on this job.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches `requires-python` in api/pyproject.toml and the Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # Covers the tests as well as the package. The TypeScript scaffold needed
      # a second tsconfig to manage that; mypy just takes both paths.
      - name: Typecheck
        run: mypy app tests

      - name: Unit tests
        run: pytest

      # The sim's determinism rests on this being off (see api/CONVENTIONS.md).
      # A pinned PYTHONHASHSEED makes every cross-process determinism test pass
      # unconditionally, so the one place it must not be set is CI.
      - name: PYTHONHASHSEED is not pinned
        run: |
          if [ -n "${PYTHONHASHSEED:-}" ]; then
            echo "::error::PYTHONHASHSEED is set to '${PYTHONHASHSEED}' — this disarms every cross-process determinism test"
            exit 1
          fi
          echo "ok: hash randomization is on"
