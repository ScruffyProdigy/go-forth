server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the runtime config — it is rewritten per environment at
  # container start, and a cached copy would hand the browser another
  # environment's API base URL.
  # No `expires -1;` here: it emits a Cache-Control of its own, and nginx sends
  # both rather than replacing one with the other. Two Cache-Control headers
  # are merged by the spec so the behaviour survives, but it is ambiguous on
  # the wire and not every intermediary merges them the same way. One header.
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Hashed Vite assets are content-addressed, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA catch-all.
  #
  # index.html must never be served stale. It is the only thing that names
  # which hashed bundle to load, and those are immutable for a year — so a
  # browser holding an old index.html also still holds the old bundle it points
  # at, and quietly runs the previous release with nothing visibly broken.
  #
  # `no-cache` stores it but revalidates every time, so the common case is a
  # cheap 304 rather than a re-download.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
